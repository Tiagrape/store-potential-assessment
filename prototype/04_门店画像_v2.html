<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>门店潜力评估 Demo · 画像 v2</title>
  <style>
    :root {
      --bg: #f3f0ea;
      --panel: rgba(255, 252, 247, 0.94);
      --panel-strong: #fffdf8;
      --line: rgba(72, 55, 34, 0.12);
      --text: #2f261d;
      --muted: #786957;
      --accent: #a14f2a;
      --accent-2: #1f6b5c;
      --warn: #b44b38;
      --good: #2d7a55;
      --shadow: 0 18px 40px rgba(72, 55, 34, 0.08);
      --radius: 18px;
      --level-high: #b24029;   /* 高潜 红棕 */
      --level-grow: #b0752a;   /* 成长 琥珀 */
      --level-base: #7a8a2a;   /* 基础 橄榄 */
      --level-low: #6b6b66;    /* 低效 灰 */
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(180, 118, 58, 0.16), transparent 28%),
        radial-gradient(circle at right center, rgba(31, 107, 92, 0.12), transparent 30%),
        linear-gradient(180deg, #f8f5ef 0%, #efe8df 100%);
    }

    .shell {
      max-width: 1520px;
      margin: 0 auto;
      padding: 28px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 18px;
      margin-bottom: 20px;
    }

    .hero-card,
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .hero-card {
      padding: 24px 26px;
      position: relative;
      overflow: hidden;
    }

    .hero-card::after {
      content: "";
      position: absolute;
      inset: auto -80px -80px auto;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(161, 79, 42, 0.15), transparent 70%);
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 34px;
      line-height: 1.15;
      font-weight: 700;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 20px;
    }

    .stat {
      padding: 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid var(--line);
    }

    .stat .label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .stat .value {
      font-size: 28px;
      font-weight: 700;
    }

    .layout {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 20px;
    }

    .panel {
      padding: 18px;
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
    }

    .panel-title h2 {
      margin: 0;
      font-size: 20px;
    }

    .panel-title span {
      font-size: 12px;
      color: var(--muted);
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    select, input[type="text"] {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel-strong);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      outline: none;
    }

    .store-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 1100px;
      overflow: auto;
      padding-right: 4px;
    }

    .store-item {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      background: rgba(255,255,255,0.56);
      cursor: pointer;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
    }

    .store-item:hover,
    .store-item.active {
      transform: translateY(-1px);
      border-color: rgba(161, 79, 42, 0.45);
      background: rgba(255,255,255,0.92);
    }

    .store-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .store-name {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.4;
    }

    .score {
      min-width: 52px;
      text-align: right;
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
    }

    .score-lev {
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      border-radius: 999px;
      padding: 2px 8px;
      display: inline-block;
    }
    .lev-high { background: var(--level-high); }
    .lev-grow { background: var(--level-grow); }
    .lev-base { background: var(--level-base); }
    .lev-low  { background: var(--level-low); }

    .meta,
    .tags,
    .list-inline {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
      background: rgba(120, 105, 87, 0.08);
      border: 1px solid rgba(120, 105, 87, 0.12);
    }

    .chip.strong {
      color: #fff;
      background: var(--accent);
      border-color: transparent;
    }

    .chip.good {
      color: #fff;
      background: var(--good);
      border-color: transparent;
    }

    .chip.warn {
      color: #fff;
      background: var(--warn);
      border-color: transparent;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 18px;
    }

    .section {
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.58);
      margin-bottom: 14px;
    }

    .section h3 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .metric {
      background: rgba(255, 252, 247, 0.96);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
    }

    .metric .k {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .metric .v {
      font-size: 22px;
      font-weight: 700;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    ul {
      margin: 0;
      padding-left: 18px;
      line-height: 1.7;
      color: var(--text);
      font-size: 13px;
    }

    .insight {
      background: linear-gradient(180deg, rgba(31,107,92,0.08), rgba(161,79,42,0.06));
    }

    .timeline {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .signal {
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.68);
    }

    .signal .t {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .signal .d {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
    }

    .prompt-box {
      white-space: pre-wrap;
      font-size: 12px;
      line-height: 1.7;
      color: var(--muted);
      background: rgba(255,255,255,0.62);
      border: 1px dashed rgba(120,105,87,0.35);
      border-radius: 14px;
      padding: 12px;
    }

    /* ===== v2 新增：潜力分可视化 ===== */
    .score-hero {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 16px;
      align-items: center;
      padding: 18px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(161,79,42,0.08), rgba(31,107,92,0.06)),
        rgba(255,255,255,0.66);
      margin-bottom: 14px;
    }

    .score-big {
      text-align: center;
      padding: 6px 16px;
    }
    .score-big .num {
      font-size: 64px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -1px;
      color: var(--accent);
    }
    .score-big .cap {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .score-meta {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px 18px;
      font-size: 13px;
    }
    .score-meta .row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed rgba(120,105,87,0.18);
      padding: 4px 0;
    }
    .score-meta .row .k { color: var(--muted); }
    .score-meta .row .v { font-weight: 600; }

    .radar-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      align-items: center;
    }
    .radar-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .radar-legends {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 6px;
    }
    .radar-legend {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .dot {
      width: 10px; height: 10px;
      border-radius: 3px;
      display: inline-block;
    }

    .dim-chips {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .dim-row {
      display: grid;
      grid-template-columns: 74px 1fr 42px;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }
    .dim-row .nm { color: var(--muted); }
    .dim-row .bar {
      height: 10px;
      border-radius: 999px;
      background: rgba(120,105,87,0.12);
      overflow: hidden;
    }
    .dim-row .bar > i {
      display: block;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }
    .dim-row .vl { font-weight: 700; text-align: right; }

    .drivers {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .driver-chip {
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(31,107,92,0.10);
      border: 1px solid rgba(31,107,92,0.22);
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
    }
    .driver-chip b { color: var(--accent-2); }

    .risk-panel {
      border: 1px solid rgba(180,75,56,0.28);
      background: rgba(180,75,56,0.06);
    }
    .risk-item {
      font-size: 13px;
      line-height: 1.6;
      padding: 4px 0;
    }
    .risk-item .amt { font-weight: 700; color: var(--warn); }

    .explain {
      font-size: 13px;
    }
    .explain .level {
      font-weight: 700;
      margin: 10px 0 4px;
    }
    .explain .level .sc { color: var(--accent); font-weight: 700; }
    .explain ul {
      margin-top: 2px;
    }
    .explain .ind {
      padding-left: 14px;
      margin: 3px 0;
      color: var(--muted);
      font-size: 12px;
    }
    .explain .ev {
      color: #56615a;
      font-size: 12px;
    }
    .explain .kv code {
      background: rgba(120,105,87,0.08);
      border-radius: 4px;
      padding: 1px 4px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
    }
    .delta {
      font-size: 13px;
      color: var(--warn);
      font-weight: 600;
    }

    @media (max-width: 1180px) {
      .hero,
      .layout,
      .detail-grid,
      .radar-wrap {
        grid-template-columns: 1fr;
      }

      .metrics {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 720px) {
      .shell {
        padding: 14px;
      }

      h1 {
        font-size: 28px;
      }

      .filters,
      .two-col,
      .timeline,
      .metrics,
      .stat-grid,
      .score-meta {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <div class="hero-card">
        <div class="eyebrow">Fxiaoke Store Intelligence Demo · v2</div>
        <h1>门店潜力评估 · 画像 v2</h1>
        <p>在 v1 门店池与画像详情基础上，新增「潜力分可视化」：五维雷达图、Top3 驱动、风险扣分与三级分数拆解 explain。所有分数来自 07 打分模型 Demo 跑分，为 10 店潜力评估的唯一数据源（依 06 主契约，画像必须说明驱动维度，禁止只报总分）。</p>
      </div>
      <div class="hero-card stat-grid" id="summaryStats"></div>
    </section>

    <section class="layout">
      <aside class="panel">
        <div class="panel-title">
          <h2>门店池</h2>
          <span id="resultCount"></span>
        </div>
        <div class="filters">
          <input id="searchInput" type="text" placeholder="搜索门店名 / 城市 / 标签" />
          <select id="tierFilter"></select>
          <select id="formatFilter"></select>
          <select id="scoreFilter"></select>
        </div>
        <div class="store-list" id="storeList"></div>
      </aside>

      <main class="panel">
        <div class="panel-title">
          <h2>门店画像详情</h2>
          <span>统一口径：近90天经营信号 · 分数源 07 §6</span>
        </div>
        <div id="detailView"></div>
      </main>
    </section>
  </div>

  <script>
    /* =========================================================
       数据源 A：10 店原始画像字段（来自 04_门店标签Demo.md）
    ========================================================= */
    const stores = [
      {

        businessCircle: "写字楼+社区", area: 118, openYears: 6,

        tenantView: { penetrationStatus: "已合作-中高渗透", orderAmount90d: 96800, orderCount90d: 54, activeDays90d: 31, lastOrderDate: "2026-08-01", visitCount90d: 11, avgStay90d: 18, orderAfterVisitRatio90d: 0.64, opportunityTags: ["冷柜扩排面", "白领场景提价带", "夜间功能饮料增量"], riskTags: ["竞品强占主位", "夜间高峰易断货"] },

          facts: ["近90天订单金额13.25万元，订单97笔，活跃下单44天。", "在售SKU数273，排面64，基础承载够用但深度一般。", "拜访后下单转化率50%，教育型拜访有较稳定反馈。"],

    /* =========================================================
       雷达图（内联 SVG，五维）
    ========================================================= */
    function radarSVG(storeId) {
      const sc = scores[storeId];
      const dimVals = DIMS.map(d => sc[d.code]);
      const R = 88, CX = 100, CY = 100, N = DIMS.length;
      const ang = (i) => -Math.PI / 2 + i * (2 * Math.PI / N);
      const pt = (i, r) => [CX + r * Math.cos(ang(i)), CY + r * Math.sin(ang(i))];

      // 背景网格(5档) + 骨架线
      let grid = "";
      for (let g = 1; g <= 5; g++) {
        const rr = R * g / 5;
        const poly = DIMS.map((_, i) => pt(i, rr).join(",")).join(" ");
        grid += `<polygon points="${poly}" fill="none" stroke="rgba(120,105,87,0.16)" stroke-width="1"/>`;
      }
      let spokes = "";
      DIMS.forEach((_, i) => {
        const [ax, ay] = pt(i, R);
        spokes += `<line x1="${CX}" y1="${CY}" x2="${ax}" y2="${ay}" stroke="rgba(120,105,87,0.16)" stroke-width="1"/>`;
        const [lx, ly] = pt(i, R + 16);
        DIMS[i].labelPos = [lx, ly];
      });

      // 数据多边形
      const dataPoly = DIMS.map((d, i) => pt(i, dimVals[i] / 100 * R).join(",")).join(" ");

      // 顶点坐标(用于标签锚点)
      const labels = DIMS.map((d) => {
        const [lx, ly] = pt(DIMS.indexOf(d), R + 17);
        let anchor = "middle";
        if (lx < CX - 8) anchor = "end";
        else if (lx > CX + 8) anchor = "start";
        let dy = 0;
        if (ly < CY - 8) dy = -4;
        else if (ly > CY + 8) dy = 12;
        else dy = 4;
        return { x: lx, y: ly, anchor, dy, d };
      });

      return `
      <svg width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="${storeId} 五维雷达图">
        ${grid}
        ${spokes}
        <polygon points="${dataPoly}" fill="rgba(161,79,42,0.18)" stroke="#a14f2a" stroke-width="2"/>
        ${DIMS.map((d, i) => { const [px, py] = pt(i, dimVals[i] / 100 * R); return `<circle cx="${px}" cy="${py}" r="3" fill="#a14f2a"/>`; }).join("")}
        ${labels.map(l => `<text x="${l.x}" y="${l.y}" text-anchor="${l.anchor}" dy="${l.dy}" font-size="10" fill="#786957">${l.d.label}</text>`).join("")}
        ${labels.map(l => `<text x="${l.x}" y="${l.y}" text-anchor="${l.anchor}" dy="${l.dy + 11}" font-size="9" fill="#a14f2a" font-weight="700">${scores[storeId][l.d.code].toFixed(1)}</text>`).join("")}
      </svg>`;
    }

              </div>
            </div>

            ${renderEvidence(store.id)}
          </div>

          <div>
            <div class="section">
              <h3>企业机会标签</h3>
              <div class="tags">${tenantOppChips}</div>
            </div>

            <div class="section">
              <h3>机会品类</h3>
              <div class="tags">${oppChips}</div>
            </div>

            <div class="section">
              <h3>竞品情况</h3>
              <ul>
                <li>竞品品牌：${store.competitor.brands.join(" / ")}</li>
                <li>竞品SKU数：${store.competitor.skuCount}</li>
                <li>价格带：${store.competitor.priceBand}</li>
                <li>排面：${store.competitor.facingCount}</li>
                <li>陈列位置：${store.competitor.displayPosition}</li>
                <li>促销状态：${store.competitor.promoStatus}</li>
              </ul>
            </div>

            <div class="section">
              <h3>库存与资产</h3>
              <ul>
                <li>在售SKU数：${store.inventory.onSaleSku}，排面数：${store.inventory.facingCount}</li>
                <li>库存量：${store.inventory.units}，库存金额：${formatCurrency(store.inventory.amount)}</li>
                <li>缺货标记：${store.inventory.oos}，最近补货时间：${store.inventory.lastRestock}</li>
                <li>POS：${store.assets.pos}，冷藏柜：${store.assets.cooler}，冷冻柜：${store.assets.freezer}</li>
                <li>货架组：${store.assets.shelfGroup}，堆头：${store.assets.stack}，数字化订货：${store.assets.digital}</li>
              </ul>
            </div>

            <div class="section">
              <h3>拜访与协议</h3>
              <ul>
                <li>近90天拜访次数：${store.visits.count90d}</li>
                <li>平均停留时长：${store.visits.avgStay90d}分钟</li>
                <li>拜访后下单转化率：${formatPercent(store.visits.orderAfterVisitRatio90d)}</li>
                <li>生效中活动协议：${store.agreements.count}个，费用${formatCurrency(store.agreements.fee)}</li>
                <li>该企业最近下单：${store.tenantView.lastOrderDate}</li>
              </ul>
            </div>

            <div class="section">
              <h3>企业风险标签</h3>
              <div class="tags">${tenantRiskChips}</div>
            </div>

            <div class="section">
              <h3>门店风险状态</h3>
              <div class="tags">${riskChips}</div>
            </div>

            <div class="section">
              <h3>门店全局标签</h3>
              <div class="tags">${store.storeGlobalTags.map(tag => `<span class="chip">${tag}</span>`).join("")}</div>
            </div>

            <div class="section">
              <h3>企业视角标签</h3>
              <div class="tags">${store.tenantCoreTags.map(tag => `<span class="chip strong">${tag}</span>`).join("")}</div>
            </div>

            <div class="section">
              <h3>AI提示词模板</h3>
              <div class="prompt-box">${promptText}</div>
            </div>
          </div>
        </div>
      `;
    }

    function bindEvents() {
      [searchInput, tierFilter, formatFilter, scoreFilter].forEach(node => {
        node.addEventListener("input", () => { renderList(); renderDetail(); });
        node.addEventListener("change", () => { renderList(); renderDetail(); });
      });
    }

    initFilters();
    renderSummary();
    bindEvents();
    renderList();
    renderDetail();
  </script>
</body>
</html>
